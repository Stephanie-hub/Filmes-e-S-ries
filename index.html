<title>Harry Potter - Maratona</title>

<style>
    * {
        box-sizing: border-box;
    }

    html {
        scroll-behavior: smooth;
    }

    body {
        margin: 0;
        min-height: 100vh;
        background:
            radial-gradient(circle at top, #29213d 0%, #111116 42%, #08080a 100%);
        color: #fff;
        font-family: Arial, Helvetica, sans-serif;
    }

    header {
        text-align: center;
        padding: 45px 20px 35px;
    }

    header h1 {
        margin: 0;
        font-size: 40px;
        font-weight: 700;
        letter-spacing: 1px;
    }

    header p {
        margin: 10px 0 0;
        color: #aaa;
        font-size: 15px;
    }

    .container {
        width: 92%;
        max-width: 1200px;
        margin: auto;
        padding-bottom: 50px;
    }

    .filmes {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 28px;
    }

    .filme {
        background: rgba(27, 27, 34, 0.96);
        border-radius: 16px;
        overflow: hidden;
        border: 1px solid rgba(255,255,255,0.08);
        box-shadow: 0 12px 35px rgba(0,0,0,0.45);
        transition: transform .2s ease, box-shadow .2s ease;
    }

    .filme:hover {
        transform: translateY(-4px);
        box-shadow: 0 18px 45px rgba(0,0,0,0.6);
    }

    .info {
        padding: 17px 18px 14px;
    }

    .numero {
        display: block;
        color: #b9a4ff;
        font-size: 12px;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 1.2px;
        margin-bottom: 7px;
    }

    .titulo {
        font-size: 18px;
        font-weight: 600;
        line-height: 1.4;
    }

    .player-area {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;
        background: #000;
    }

    video {
        display: block;
        width: 100%;
        height: 100%;
        background: #000;
        object-fit: contain;
    }

    .fallback {
        display: none;
        position: absolute;
        inset: 0;
        background:
            linear-gradient(
                rgba(0,0,0,.72),
                rgba(0,0,0,.92)
            );
        align-items: center;
        justify-content: center;
        flex-direction: column;
        text-align: center;
        padding: 25px;
    }

    .fallback p {
        color: #ccc;
        margin: 0 0 16px;
        font-size: 14px;
    }

    .fallback a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 11px 18px;
        border-radius: 8px;
        background: #fff;
        color: #111;
        text-decoration: none;
        font-size: 14px;
        font-weight: bold;
        transition: .2s;
    }

    .fallback a:hover {
        background: #ddd;
        transform: translateY(-1px);
    }

    .rodape {
        text-align: center;
        padding: 0 20px 35px;
        color: #666;
        font-size: 12px;
    }

    @media (max-width: 800px) {

        .filmes {
            grid-template-columns: 1fr;
        }

        header {
            padding: 35px 15px 28px;
        }

        header h1 {
            font-size: 30px;
        }

        header p {
            font-size: 14px;
        }

        .container {
            width: 95%;
        }

        .filmes {
            gap: 20px;
        }
    }
</style>
