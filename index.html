<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minha Estante</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #090a0d;
      --card: #15171c;
      --text: #f5f5f5;
      --muted: #999da7;
      --accent: #b88a4a;
      --accent-light: #d9b77a;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
    }

    button {
      font-family: inherit;
      cursor: pointer;
    }

    /* ==============================
       CABEÇALHO
    ============================== */

    header {
      height: 75px;
      display: flex;
      align-items: center;
      padding: 0 5%;
      border-bottom: 1px solid rgba(255,255,255,.06);
      background: rgba(9,10,13,.96);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .logo {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 3px;
    }

    .logo span {
      color: var(--accent-light);
    }

    .search {
      margin-left: auto;
      width: 240px;
      background: #15171c;
      border: 1px solid #292c32;
      border-radius: 8px;
      padding: 10px 13px;
      color: white;
      outline: none;
    }

    /* ==============================
       HERO
    ============================== */

    .hero {
      min-height: 380px;
      margin: 25px 5% 0;
      border-radius: 15px;
      display: flex;
      align-items: center;
      padding: 55px;
      background:
        linear-gradient(
          90deg,
          rgba(9,10,13,.98),
          rgba(9,10,13,.78),
          rgba(9,10,13,.2)
        ),
        url("https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=1600&q=80")
        center/cover;
    }

    .hero-content {
      max-width: 580px;
    }

    .small-title {
      color: var(--accent-light);
      font-size: 12px;
      letter-spacing: 3px;
      margin-bottom: 15px;
    }

    .hero h1 {
      font-family: Georgia, serif;
      font-size: 52px;
      line-height: 1.05;
      margin-bottom: 15px;
    }

    .hero p {
      color: #bbbfc7;
      line-height: 1.6;
      max-width: 500px;
    }

    /* ==============================
       CATÁLOGO
    ============================== */

    .catalog-section {
      padding: 45px 5%;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 22px;
    }

    .section-title h2 {
      font-family: Georgia, serif;
      font-size: 28px;
    }

    .section-title span {
      color: var(--muted);
      font-size: 13px;
    }

    .catalog {
      display: grid;
      grid-template-columns:
        repeat(auto-fill, minmax(180px, 1fr));
      gap: 22px;
    }

    /* ==============================
       CARD
    ============================== */

    .card {
      background: var(--card);
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid transparent;
      transition: .25s;
      position: relative;
    }

    .card:hover {
      transform: translateY(-6px);
      border-color: #383b42;
    }

    .poster {
      width: 100%;
      aspect-ratio: 2 / 3;
      object-fit: cover;
      display: block;
    }

    .card-info {
      padding: 13px;
    }

    .card-title {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.4;
    }

    .card-subtitle {
      color: #777c86;
      font-size: 11px;
      margin-top: 6px;
    }

    .play-icon {
      position: absolute;
      left: 50%;
      top: 42%;
      transform: translate(-50%, -50%);
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: none;
      background: rgba(184,138,74,.95);
      color: white;
      font-size: 19px;
      opacity: 0;
      transition: .2s;
    }

    .card:hover .play-icon {
      opacity: 1;
    }

    /* ==============================
       MODAL
    ============================== */

    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.88);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }

    .modal-bg.active {
      display: flex;
    }

    .modal {
      width: min(850px, 100%);
      max-height: 90vh;
      overflow-y: auto;
      background: #15171c;
      border-radius: 14px;
      display: flex;
      position: relative;
    }

    .modal-poster {
      width: 290px;
      object-fit: cover;
    }

    .modal-info {
      padding: 35px;
      flex: 1;
    }

    .modal-info h2 {
      font-family: Georgia, serif;
      font-size: 32px;
      margin-bottom: 10px;
    }

    .modal-info p {
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .watch-button {
      background: var(--accent);
      border: none;
      color: white;
      border-radius: 7px;
      padding: 13px 22px;
      font-weight: bold;
      font-size: 14px;
    }

    .watch-button:hover {
      background: var(--accent-light);
      color: #111;
    }

    .close {
      position: absolute;
      right: 15px;
      top: 15px;
      width: 38px;
      height: 38px;
      border: none;
      border-radius: 50%;
      background: rgba(0,0,0,.65);
      color: white;
      font-size: 22px;
      z-index: 2;
    }

    /* ==============================
       PLAYER
    ============================== */

    .player-bg {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .player-bg.active {
      display: flex;
    }

    .player-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 30px;
    }

    .player-title {
      margin-bottom: 12px;
      color: #ddd;
      font-size: 15px;
    }

    video {
      width: 100%;
      max-height: 82vh;
      background: #000;
    }

    .player-close {
      position: absolute;
      right: 25px;
      top: 20px;
      width: 42px;
      height: 42px;
      border: none;
      border-radius: 50%;
      background: #222;
      color: white;
      font-size: 23px;
      z-index: 3;
    }

    /* ==============================
       VAZIO
    ============================== */

    .empty {
      text-align: center;
      padding: 60px;
      color: #777;
    }

    /* ==============================
       RESPONSIVO
    ============================== */

    @media (max-width: 700px) {

      header {
        padding: 0 4%;
      }

      .search {
        width: 150px;
      }

      .hero {
        margin: 15px 3%;
        min-height: 330px;
        padding: 30px;
      }

      .hero h1 {
        font-size: 37px;
      }

      .catalog-section {
        padding: 30px 4%;
      }

      .catalog {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }

      .modal {
        display: block;
      }

      .modal-poster {
        width: 100%;
        height: 280px;
      }

      .modal-info {
        padding: 25px;
      }

      .modal-info h2 {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

  <!-- =====================================
       CABEÇALHO
  ====================================== -->

  <header>

    <div class="logo">
      MINHA <span>ESTANTE</span>
    </div>

    <input
      class="search"
      id="search"
      type="text"
      placeholder="Pesquisar..."
      oninput="renderCatalog()"
    >

  </header>


  <!-- =====================================
       DESTAQUE
  ====================================== -->

  <section class="hero">

    <div class="hero-content">

      <div class="small-title">
        MINHA COLEÇÃO
      </div>

      <h1>
        Harry Potter
      </h1>

      <p>
        Minha coleção pessoal de filmes.
        Escolha um título para abrir e assistir.
      </p>

    </div>

  </section>


  <!-- =====================================
       CATÁLOGO
  ====================================== -->

  <section class="catalog-section">

    <div class="section-title">

      <h2>
        Harry Potter
      </h2>

      <span id="count"></span>

    </div>

    <div
      class="catalog"
      id="catalog"
    ></div>

    <div
      class="empty"
      id="empty"
      style="display:none"
    >
      Nenhum filme encontrado.
    </div>

  </section>


  <!-- =====================================
       MODAL
  ====================================== -->

  <div
    class="modal-bg"
    id="modal"
  >

    <div class="modal">

      <button
        class="close"
        onclick="closeModal()"
      >
        ×
      </button>

      <img
        class="modal-poster"
        id="modalPoster"
        src=""
        alt=""
      >

      <div class="modal-info">

        <h2 id="modalTitle"></h2>

        <p id="modalDescription"></p>

        <button
          class="watch-button"
          id="watchButton"
        >
          ▶ Assistir
        </button>

      </div>

    </div>

  </div>


  <!-- =====================================
       PLAYER
  ====================================== -->

  <div
    class="player-bg"
    id="player"
  >

    <button
      class="player-close"
      onclick="closePlayer()"
    >
      ×
    </button>

    <div class="player-container">

      <div
        class="player-title"
        id="playerTitle"
      ></div>

      <video
        id="video"
        controls
        playsinline
      ></video>

    </div>

  </div>


  <script>

    /*
    ==========================================================
    FILMES

    Aqui ficam os filmes da sua coleção.

    Para adicionar outro filme, copie um bloco e altere:
    - title
    - year
    - poster
    - description
    - video

    Use somente URLs de vídeo que você tenha autorização
    para reproduzir.
    ==========================================================
    */

    const filmes = [

      {
        title:
          "Harry Potter e a Pedra Filosofal",

        year:
          "2001",

        poster:
          "https://image.tmdb.org/t/p/w500/l1T6Y3mY9Z8N4M9Q0F1A0P8Q8rH.jpg",

        description:
          "Harry Potter descobre que é um bruxo e começa seus estudos em Hogwarts.",

        video:
          "COLE_AQUI_O_LINK_AUTORIZADO"
      },


      {
        title:
          "Harry Potter e a Câmara Secreta",

        year:
          "2002",

        poster:
          "https://image.tmdb.org/t/p/w500/7xXJ15VEf7G9Gd7mYJf1A9pQW8M.jpg",

        description:
          "Harry retorna a Hogwarts e descobre que uma antiga ameaça foi libertada.",

        video:
          "COLE_AQUI_O_LINK_AUTORIZADO"
      },


      {
        title:
          "Harry Potter e o Prisioneiro de Azkaban",

        year:
          "2004",

        poster:
          "https://image.tmdb.org/t/p/w500/aWxwnYoe8p2d2uE6Q3J7qJ1R8cL.jpg",

        description:
          "Harry conhece mais sobre o passado de sua família enquanto Sirius Black escapa de Azkaban.",

        video:
          "COLE_AQUI_O_LINK_AUTORIZADO"
      },


      {
        title:
          "Harry Potter e o Cálice de Fogo",

        year:
          "2005",

        poster:
          "https://image.tmdb.org/t/p/w500/fECBtHlr0RB2H5J4j3sY1kK8w5A.jpg",

        description:
          "Harry é inesperadamente escolhido para participar do Torneio Tribruxo.",

        video:
          "COLE_AQUI_O_LINK_AUTORIZADO"
      },


      {
        title:
          "Harry Potter e a Ordem da Fênix",

        year:
          "2007",

        poster:
          "https://image.tmdb.org/t/p/w500/5aOyriWkPec0zUDwY5Y4Q8Q1b2K.jpg",

        description:
          "Harry enfrenta uma nova realidade em Hogwarts enquanto o mundo bruxo se prepara para uma ameaça crescente.",

        video:
          "COLE_AQUI_O_LINK_AUTORIZADO"
      },


      {
        title:
          "Harry Potter e o Enigma do Príncipe",

        year:
          "2009",

        poster:
          "https://image.tmdb.org/t/p/w500/z7uo8BjKXf5GQkJ8J1D4Y5K6Q9A.jpg",

        description:
          "Harry descobre informações importantes sobre o passado de Voldemort.",

        video:
          "COLE_AQUI_O_LINK_AUTORIZADO"
      },


      {
        title:
          "Harry Potter e as Relíquias da Morte — Parte 1",

        year:
          "2010",

        poster:
          "https://image.tmdb.org/t/p/w500/iGoXIpQb7Pot00EEdwpwPajheZ5.jpg",

        description:
          "Harry, Ron e Hermione deixam Hogwarts para procurar as Horcruxes.",

        video:
          "COLE_AQUI_O_LINK_AUTORIZADO"
      },


      {
        title:
          "Harry Potter e as Relíquias da Morte — Parte 2",

        year:
          "2011",

        poster:
          "https://image.tmdb.org/t/p/w500/c54HpQmuwXjHq2C9wmoacY9bq6P.jpg",

        description:
          "A batalha final entre Harry Potter e Voldemort chega ao seu desfecho.",

        video:
          "COLE_AQUI_O_LINK_AUTORIZADO"
      }

    ];


    /* ======================================================
       ELEMENTOS
    ====================================================== */

    const catalog =
      document.getElementById("catalog");

    const search =
      document.getElementById("search");

    const count =
      document.getElementById("count");

    const empty =
      document.getElementById("empty");

    const modal =
      document.getElementById("modal");

    const modalPoster =
      document.getElementById("modalPoster");

    const modalTitle =
      document.getElementById("modalTitle");

    const modalDescription =
      document.getElementById("modalDescription");

    const watchButton =
      document.getElementById("watchButton");

    const player =
      document.getElementById("player");

    const video =
      document.getElementById("video");

    const playerTitle =
      document.getElementById("playerTitle");


    let filmeSelecionado = null;


    /* ======================================================
       MOSTRAR CATÁLOGO
    ====================================================== */

    function renderCatalog() {

      const termo =
        search.value
          .toLowerCase()
          .trim();


      const resultados =
        filmes.filter(filme =>
          filme.title
            .toLowerCase()
            .includes(termo)
        );


      catalog.innerHTML = "";


      count.textContent =
        resultados.length + " filmes";


      if (resultados.length === 0) {

        empty.style.display = "block";

        return;

      }


      empty.style.display = "none";


      resultados.forEach((filme, index) => {

        const card =
          document.createElement("div");

        card.className = "card";


        card.innerHTML = `

          <img
            class="poster"
            src="${filme.poster}"
            alt="${filme.title}"
          >

          <button
            class="play-icon"
            onclick="openMovie(${index})"
          >
            ▶
          </button>

          <div
            class="card-info"
            onclick="openMovie(${index})"
          >

            <div class="card-title">
              ${filme.title}
            </div>

            <div class="card-subtitle">
              ${filme.year}
            </div>

          </div>

        `;


        /*
          O card inteiro também abre o filme.
        */

        card.onclick = function(event) {

          if (
            !event.target.classList.contains(
              "play-icon"
            )
          ) {

            openMovie(
              filmes.indexOf(filme)
            );

          }

        };


        catalog.appendChild(card);

      });

    }


    /* ======================================================
       ABRIR FILME
    ====================================================== */

    function openMovie(index) {

      filmeSelecionado =
        filmes[index];


      if (!filmeSelecionado) {
        return;
      }


      modalPoster.src =
        filmeSelecionado.poster;


      modalTitle.textContent =
        filmeSelecionado.title;


      modalDescription.textContent =
        filmeSelecionado.description;


      modal.classList.add("active");


      watchButton.onclick =
        function() {

          closeModal();

          openPlayer(
            filmeSelecionado.video,
            filmeSelecionado.title
          );

        };

    }


    /* ======================================================
       FECHAR MODAL
    ====================================================== */

    function closeModal() {

      modal.classList.remove("active");

    }


    /* ======================================================
       ABRIR PLAYER
    ====================================================== */

    function openPlayer(url, title) {

      if (
        !url ||
        url === "COLE_AQUI_O_LINK_AUTORIZADO"
      ) {

        alert(
          "Este filme ainda não possui um link de vídeo cadastrado."
        );

        return;

      }


      playerTitle.textContent =
        title;


      video.src =
        url;


      player.classList.add("active");


      video.play().catch(() => {});

    }


    /* ======================================================
       FECHAR PLAYER
    ====================================================== */

    function closePlayer() {

      video.pause();

      video.removeAttribute("src");

      video.load();

      player.classList.remove("active");

    }


    /* ======================================================
       ESC
    ====================================================== */

    document.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Escape") {

          closeModal();

          closePlayer();

        }

      }
    );


    /* ======================================================
       INICIAR
    ====================================================== */

    renderCatalog();

  </script>

</body>
</html>
