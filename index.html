<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Minha Stream</title>

  <!-- HLS para vídeos .m3u8 -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #08090c;
      --bg2: #101217;
      --card: #17191f;
      --red: #e50914;
      --text: #ffffff;
      --muted: #999ca5;
      --border: #282b32;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
    }

    button,
    input {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      height: 72px;
      background: rgba(8, 9, 12, 0.96);
      display: flex;
      align-items: center;
      padding: 0 5%;
      gap: 35px;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .logo {
      font-size: 22px;
      font-weight: 900;
      white-space: nowrap;
      letter-spacing: 1px;
    }

    .logo span {
      color: var(--red);
    }

    nav {
      display: flex;
      gap: 20px;
    }

    nav button {
      background: none;
      border: none;
      color: #bbb;
      font-size: 14px;
      transition: .2s;
    }

    nav button:hover,
    nav button.active {
      color: white;
    }

    .search-box {
      margin-left: auto;
      width: 250px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: #17191f;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 12px;
    }

    .search-box input {
      width: 100%;
      border: none;
      outline: none;
      background: transparent;
      color: white;
      font-size: 14px;
    }

    .search-box input::placeholder {
      color: #777;
    }

    /* =========================
       HERO
    ========================= */

    .hero {
      min-height: 470px;
      margin: 0 4%;
      border-radius: 18px;
      overflow: hidden;
      position: relative;
      display: flex;
      align-items: center;
      padding: 60px;
      background:
        linear-gradient(
          90deg,
          rgba(5,6,8,0.98) 0%,
          rgba(5,6,8,0.82) 35%,
          rgba(5,6,8,0.25) 75%,
          rgba(5,6,8,0.2) 100%
        ),
        url("https://picsum.photos/seed/cinema/1600/800")
        center/cover;
    }

    .hero-content {
      max-width: 580px;
    }

    .hero-label {
      color: var(--red);
      font-size: 12px;
      letter-spacing: 3px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .hero h1 {
      font-size: 52px;
      line-height: 1.03;
      margin-bottom: 20px;
    }

    .hero p {
      color: #c0c1c5;
      line-height: 1.6;
      font-size: 15px;
      margin-bottom: 25px;
    }

    .hero-button {
      border: none;
      background: white;
      color: black;
      padding: 13px 22px;
      border-radius: 7px;
      font-weight: bold;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .hero-button:hover {
      background: #ddd;
    }

    /* =========================
       SEÇÕES
    ========================= */

    .section {
      padding: 35px 5%;
    }

    .section-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    .section-header h2 {
      font-size: 24px;
    }

    .section-header span {
      color: #666;
      font-size: 13px;
    }

    /* =========================
       CARDS
    ========================= */

    .catalog {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 18px;
    }

    .card {
      background: var(--card);
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid transparent;
      transition: .2s;
      position: relative;
    }

    .card:hover {
      transform: translateY(-5px);
      border-color: #333;
    }

    .card-poster {
      width: 100%;
      aspect-ratio: 2 / 3;
      object-fit: cover;
      display: block;
    }

    .card-info {
      padding: 11px;
    }

    .card-title {
      font-size: 14px;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-meta {
      margin-top: 6px;
      color: #777;
      font-size: 11px;
    }

    .favorite-button {
      position: absolute;
      right: 8px;
      top: 8px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: none;
      background: rgba(0,0,0,.75);
      color: white;
      font-size: 17px;
      z-index: 2;
    }

    .favorite-button.active {
      color: #ff3040;
    }

    /* =========================
       MODAL
    ========================= */

    .modal-background {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.85);
      z-index: 500;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-background.show {
      display: flex;
    }

    .modal {
      width: min(900px, 100%);
      max-height: 90vh;
      overflow-y: auto;
      background: #15171c;
      border-radius: 14px;
      position: relative;
      display: flex;
    }

    .modal-poster {
      width: 300px;
      object-fit: cover;
    }

    .modal-content {
      padding: 35px;
      flex: 1;
    }

    .modal-close {
      position: absolute;
      right: 15px;
      top: 15px;
      width: 38px;
      height: 38px;
      border: none;
      border-radius: 50%;
      background: #24262c;
      color: white;
      font-size: 22px;
    }

    .modal h2 {
      font-size: 32px;
      margin-bottom: 10px;
      padding-right: 40px;
    }

    .modal-meta {
      color: #888;
      margin-bottom: 20px;
      font-size: 13px;
    }

    .modal-description {
      color: #bbb;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .watch-button {
      border: none;
      background: var(--red);
      color: white;
      padding: 12px 20px;
      border-radius: 7px;
      font-weight: bold;
      margin-bottom: 25px;
    }

    .watch-button:hover {
      background: #ff1a25;
    }

    /* =========================
       EPISÓDIOS
    ========================= */

    .season-title {
      font-size: 17px;
      margin: 15px 0 10px;
    }

    .episode {
      width: 100%;
      border: none;
      background: #20232a;
      color: white;
      border-radius: 7px;
      padding: 12px;
      margin-bottom: 7px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-align: left;
    }

    .episode:hover {
      background: #292c34;
    }

    /* =========================
       PLAYER
    ========================= */

    .player-background {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.96);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .player-background.show {
      display: flex;
    }

    .player-container {
      width: min(1200px, 100%);
      position: relative;
    }

    .player-title {
      font-size: 18px;
      margin-bottom: 12px;
    }

    video {
      width: 100%;
      max-height: 80vh;
      background: black;
      display: block;
    }

    .player-close {
      position: absolute;
      right: 0;
      top: -50px;
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 50%;
      background: #25272c;
      color: white;
      font-size: 22px;
    }

    /* =========================
       SEM RESULTADOS
    ========================= */

    .empty {
      color: #777;
      padding: 40px 0;
      text-align: center;
    }

    /* =========================
       ADMIN
    ========================= */

    .admin-box {
      background: #121419;
      border: 1px solid var(--border);
      padding: 25px;
      border-radius: 12px;
      max-width: 700px;
      margin: 0 auto;
    }

    .admin-box h2 {
      margin-bottom: 20px;
    }

    .admin-box input,
    .admin-box textarea,
    .admin-box select {
      width: 100%;
      background: #1b1e24;
      color: white;
      border: 1px solid #30333a;
      border-radius: 7px;
      padding: 11px;
      margin-bottom: 10px;
      outline: none;
    }

    .admin-box textarea {
      min-height: 100px;
      resize: vertical;
    }

    .admin-button {
      border: none;
      background: var(--red);
      color: white;
      padding: 11px 18px;
      border-radius: 7px;
      font-weight: bold;
    }

    .admin-note {
      color: #777;
      font-size: 12px;
      margin-top: 15px;
      line-height: 1.5;
    }

    /* =========================
       RESPONSIVO
    ========================= */

    @media (max-width: 800px) {

      header {
        padding: 0 4%;
        gap: 15px;
      }

      nav {
        display: none;
      }

      .search-box {
        width: 170px;
      }

      .hero {
        min-height: 380px;
        padding: 35px;
      }

      .hero h1 {
        font-size: 38px;
      }

      .modal {
        display: block;
      }

      .modal-poster {
        width: 100%;
        height: 280px;
      }

      .catalog {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 500px) {

      .logo {
        font-size: 17px;
      }

      .search-box {
        width: 140px;
      }

      .hero {
        margin: 0 3%;
        padding: 25px;
      }

      .hero h1 {
        font-size: 31px;
      }

      .section {
        padding: 25px 4%;
      }

      .catalog {
        gap: 10px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       CABEÇALHO
  ========================== -->

  <header>

    <div class="logo">
      MINHA<span>STREAM</span>
    </div>

    <nav>
      <button class="active" onclick="changePage('home')">
        Início
      </button>

      <button onclick="changePage('favorites')">
        Minha lista
      </button>

      <button onclick="changePage('admin')">
        Adicionar
      </button>
    </nav>

    <div class="search-box">

      🔎

      <input
        id="searchInput"
        type="text"
        placeholder="Buscar filmes e séries..."
        oninput="searchCatalog()"
      >

    </div>

  </header>


  <!-- =========================
       CONTEÚDO PRINCIPAL
  ========================== -->

  <main id="mainContent">

    <!-- HERO -->

    <section class="hero">

      <div class="hero-content">

        <div class="hero-label">
          SEU CATÁLOGO
        </div>

        <h1>
          Filmes e séries
          <br>
          em um só lugar.
        </h1>

        <p>
          Organize seus filmes e séries favoritos em uma interface
          simples, bonita e adaptada para computador, celular e TV.
        </p>

        <button
          class="hero-button"
          onclick="scrollToCatalog()"
        >
          ▶ Ver catálogo
        </button>

      </div>

    </section>


    <!-- CATÁLOGO -->

    <section class="section" id="catalogSection">

      <div class="section-header">

        <h2 id="sectionTitle">
          Filmes e séries
        </h2>

        <span id="resultCount"></span>

      </div>

      <div
        class="catalog"
        id="catalog"
      ></div>

      <div
        class="empty"
        id="emptyMessage"
        style="display:none"
      >
        Nenhum título encontrado.
      </div>

    </section>

  </main>


  <!-- =========================
       MODAL DO FILME
  ========================== -->

  <div
    class="modal-background"
    id="movieModal"
  >

    <div class="modal">

      <button
        class="modal-close"
        onclick="closeMovie()"
      >
        ×
      </button>

      <img
        class="modal-poster"
        id="modalPoster"
        src=""
        alt=""
      >

      <div class="modal-content">

        <h2 id="modalTitle"></h2>

        <div
          class="modal-meta"
          id="modalMeta"
        ></div>

        <p
          class="modal-description"
          id="modalDescription"
        ></p>

        <div id="modalActions"></div>

      </div>

    </div>

  </div>


  <!-- =========================
       PLAYER
  ========================== -->

  <div
    class="player-background"
    id="playerBackground"
  >

    <div class="player-container">

      <button
        class="player-close"
        onclick="closePlayer()"
      >
        ×
      </button>

      <div
        class="player-title"
        id="playerTitle"
      ></div>

      <video
        id="videoPlayer"
        controls
        playsinline
      ></video>

    </div>

  </div>


  <script>

    /* =========================================================
       CATÁLOGO
    ========================================================= */

    const defaultCatalog = [

      {
        id: "filme-1",

        title: "Big Buck Bunny",

        year: 2008,

        genre: "Animação",

        type: "movie",

        poster:
          "https://picsum.photos/seed/bunny/600/900",

        description:
          "Filme de demonstração utilizado para testar o player.",

        video:
          "https://storage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"
      },


      {
        id: "filme-2",

        title: "Elephants Dream",

        year: 2006,

        genre: "Animação",

        type: "movie",

        poster:
          "https://picsum.photos/seed/elephants/600/900",

        description:
          "Outro vídeo de demonstração.",

        video:
          "https://storage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4"
      },


      {
        id: "serie-1",

        title: "Minha Série",

        year: 2025,

        genre: "Série",

        type: "series",

        poster:
          "https://picsum.photos/seed/series/600/900",

        description:
          "Exemplo de uma série com temporadas e episódios.",

        seasons: [

          {
            number: 1,

            episodes: [

              {
                id: "ep1",

                title: "Episódio 1",

                video:
                  "https://storage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4"
              },

              {
                id: "ep2",

                title: "Episódio 2",

                video:
                  "https://storage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4"
              }

            ]
          }

        ]
      }

    ];


    /*
      Carrega os filmes salvos no navegador.

      Assim você poderá adicionar títulos pelo próprio site.
    */

    let catalog =
      JSON.parse(
        localStorage.getItem("myStreamCatalog")
      ) || defaultCatalog;


    let favorites =
      JSON.parse(
        localStorage.getItem("myStreamFavorites")
      ) || [];


    let currentPage = "home";


    /* =========================================================
       SALVAR CATÁLOGO
    ========================================================= */

    function saveCatalog() {

      localStorage.setItem(
        "myStreamCatalog",
        JSON.stringify(catalog)
      );

    }


    /* =========================================================
       SALVAR FAVORITOS
    ========================================================= */

    function saveFavorites() {

      localStorage.setItem(
        "myStreamFavorites",
        JSON.stringify(favorites)
      );

    }


    /* =========================================================
       EXIBIR CATÁLOGO
    ========================================================= */

    function renderCatalog(list = catalog) {

      const container =
        document.getElementById("catalog");

      const empty =
        document.getElementById("emptyMessage");

      const count =
        document.getElementById("resultCount");

      container.innerHTML = "";

      count.textContent =
        list.length + " título(s)";


      if (list.length === 0) {

        empty.style.display = "block";

        return;

      }

      empty.style.display = "none";


      list.forEach(movie => {

        const card =
          document.createElement("div");

        card.className = "card";


        const isFavorite =
          favorites.includes(movie.id);


        card.innerHTML = `

          <button
            class="favorite-button ${isFavorite ? "active" : ""}"
            onclick="toggleFavorite(event, '${movie.id}')"
          >
            ${isFavorite ? "♥" : "♡"}
          </button>

          <img
            class="card-poster"
            src="${movie.poster}"
            alt="${escapeHtml(movie.title)}"
            onclick="openMovie('${movie.id}')"
          >

          <div
            class="card-info"
            onclick="openMovie('${movie.id}')"
            style="cursor:pointer"
          >

            <div class="card-title">
              ${escapeHtml(movie.title)}
            </div>

            <div class="card-meta">
              ${movie.year || ""}
              ${movie.genre ? " • " + escapeHtml(movie.genre) : ""}
            </div>

          </div>
        `;


        container.appendChild(card);

      });

    }


    /* =========================================================
       ABRIR FILME
    ========================================================= */

    function openMovie(id) {

      const movie =
        catalog.find(item => item.id === id);

      if (!movie) return;


      document.getElementById("modalPoster").src =
        movie.poster;

      document.getElementById("modalTitle").textContent =
        movie.title;

      document.getElementById("modalMeta").textContent =
        `${movie.year || ""} • ${movie.genre || ""}`;


      document.getElementById("modalDescription").textContent =
        movie.description || "";


      const actions =
        document.getElementById("modalActions");

      actions.innerHTML = "";


      /*
        FILME
      */

      if (
        movie.type === "movie" &&
        movie.video
      ) {

        const button =
          document.createElement("button");

        button.className = "watch-button";

        button.textContent = "▶ Assistir";

        button.onclick = () => {

          closeMovie();

          openPlayer(
            movie.video,
            movie.title
          );

        };


        actions.appendChild(button);

      }


      /*
        SÉRIE
      */

      if (
        movie.type === "series" &&
        movie.seasons
      ) {

        movie.seasons.forEach(season => {

          const title =
            document.createElement("div");

          title.className = "season-title";

          title.textContent =
            "Temporada " + season.number;

          actions.appendChild(title);


          season.episodes.forEach(episode => {

            const button =
              document.createElement("button");

            button.className = "episode";

            button.innerHTML = `

              <span>
                ${escapeHtml(episode.title)}
              </span>

              <span>
                ▶
              </span>

            `;


            button.onclick = () => {

              closeMovie();

              openPlayer(
                episode.video,
                movie.title + " — " + episode.title
              );

            };


            actions.appendChild(button);

          });

        });

      }


      document
        .getElementById("movieModal")
        .classList.add("show");

    }


    /* =========================================================
       FECHAR FILME
    ========================================================= */

    function closeMovie() {

      document
        .getElementById("movieModal")
        .classList.remove("show");

    }


    /* =========================================================
       PLAYER
    ========================================================= */

    let hlsInstance = null;


    function openPlayer(url, title) {

      const player =
        document.getElementById("videoPlayer");

      document.getElementById("playerTitle")
        .textContent = title;


      document
        .getElementById("playerBackground")
        .classList.add("show");


      /*
        Limpa player anterior
      */

      if (hlsInstance) {

        hlsInstance.destroy();

        hlsInstance = null;

      }


      player.pause();

      player.removeAttribute("src");

      player.load();


      /*
        HLS (.m3u8)
      */

      if (
        url.includes(".m3u8") &&
        typeof Hls !== "undefined" &&
        Hls.isSupported()
      ) {

        hlsInstance =
          new Hls();

        hlsInstance.loadSource(url);

        hlsInstance.attachMedia(player);

        hlsInstance.on(
          Hls.Events.MANIFEST_PARSED,
          function () {

            player.play().catch(() => {});

          }
        );

      }

      /*
        Safari / dispositivos com HLS nativo
      */

      else if (
        url.includes(".m3u8") &&
        player.canPlayType(
          "application/vnd.apple.mpegurl"
        )
      ) {

        player.src = url;

        player.play().catch(() => {});

      }

      /*
        MP4
      */

      else {

        player.src = url;

        player.play().catch(() => {});

      }

    }


    /* =========================================================
       FECHAR PLAYER
    ========================================================= */

    function closePlayer() {

      const player =
        document.getElementById("videoPlayer");


      player.pause();


      if (hlsInstance) {

        hlsInstance.destroy();

        hlsInstance = null;

      }


      player.removeAttribute("src");

      player.load();


      document
        .getElementById("playerBackground")
        .classList.remove("show");

    }


    /* =========================================================
       FAVORITOS
    ========================================================= */

    function toggleFavorite(event, id) {

      event.stopPropagation();


      if (favorites.includes(id)) {

        favorites =
          favorites.filter(
            favorite => favorite !== id
          );

      } else {

        favorites.push(id);

      }


      saveFavorites();

      renderCatalog(
        getCurrentList()
      );

    }


    /* =========================================================
       PESQUISA
    ========================================================= */

    function searchCatalog() {

      const search =
        document
          .getElementById("searchInput")
          .value
          .toLowerCase()
          .trim();


      let list =
        getCurrentList();


      if (search) {

        list =
          list.filter(movie =>

            movie.title
              .toLowerCase()
              .includes(search)

            ||

            (movie.genre || "")
              .toLowerCase()
              .includes(search)

          );

      }


      renderCatalog(list);

    }


    /* =========================================================
       LISTA ATUAL
    ========================================================= */

    function getCurrentList() {

      if (currentPage === "favorites") {

        return catalog.filter(
          movie =>
            favorites.includes(movie.id)
        );

      }


      return catalog;

    }


    /* =========================================================
       NAVEGAÇÃO
    ========================================================= */

    function changePage(page) {

      currentPage = page;


      document
        .querySelectorAll("nav button")
        .forEach(button => {

          button.classList.remove("active");

        });


      if (page === "home") {

        document.querySelectorAll("nav button")[0]
          .classList.add("active");

        document.getElementById("mainContent").innerHTML = `

          <section class="hero">

            <div class="hero-content">

              <div class="hero-label">
                SEU CATÁLOGO
              </div>

              <h1>
                Filmes e séries
                <br>
                em um só lugar.
              </h1>

              <p>
                Organize seus filmes e séries favoritos
                em uma interface simples e bonita.
              </p>

              <button
                class="hero-button"
                onclick="scrollToCatalog()"
              >
                ▶ Ver catálogo
              </button>

            </div>

          </section>


          <section class="section" id="catalogSection">

            <div class="section-header">

              <h2>
                Filmes e séries
              </h2>

              <span id="resultCount"></span>

            </div>

            <div
              class="catalog"
              id="catalog"
            ></div>

            <div
              class="empty"
              id="emptyMessage"
              style="display:none"
            >
              Nenhum título encontrado.
            </div>

          </section>

        `;


        searchCatalog();

      }


      if (page === "favorites") {

        document.querySelectorAll("nav button")[1]
          .classList.add("active");


        document.getElementById("mainContent").innerHTML = `

          <section class="section" style="padding-top:50px">

            <div class="section-header">

              <h2>
                Minha lista
              </h2>

              <span id="resultCount"></span>

            </div>

            <div
              class="catalog"
              id="catalog"
            ></div>

            <div
              class="empty"
              id="emptyMessage"
              style="display:none"
            >
              Você ainda não adicionou nenhum título.
            </div>

          </section>

        `;


        searchCatalog();

      }


      if (page === "admin") {

        document.querySelectorAll("nav button")[2]
          .classList.add("active");


        showAdmin();

      }

    }


    /* =========================================================
       ÁREA PARA ADICIONAR FILMES
    ========================================================= */

    function showAdmin() {

      document.getElementById("mainContent").innerHTML = `

        <section class="section">

          <div class="admin-box">

            <h2>
              Adicionar filme ou série
            </h2>

            <input
              id="adminTitle"
              placeholder="Nome do filme ou série"
            >

            <input
              id="adminYear"
              type="number"
              placeholder="Ano"
            >

            <input
              id="adminGenre"
              placeholder="Gênero"
            >

            <input
              id="adminPoster"
              placeholder="URL da capa"
            >

            <select id="adminType">

              <option value="movie">
                Filme
              </option>

              <option value="series">
                Série
              </option>

            </select>

            <input
              id="adminVideo"
              placeholder="URL direta do vídeo (.mp4 ou .m3u8)"
            >

            <textarea
              id="adminDescription"
              placeholder="Descrição"
            ></textarea>

            <button
              class="admin-button"
              onclick="addMovie()"
            >
              + Adicionar ao catálogo
            </button>


            <p class="admin-note">

              Para filmes, informe uma URL direta/autorizada
              de vídeo MP4 ou HLS (.m3u8).

              <br><br>

              Os dados adicionados por aqui ficam salvos
              apenas neste navegador através do localStorage.

            </p>

          </div>

        </section>

      `;

    }


    /* =========================================================
       ADICIONAR FILME
    ========================================================= */

    function addMovie() {

      const title =
        document.getElementById("adminTitle").value.trim();

      const year =
        document.getElementById("adminYear").value;

      const genre =
        document.getElementById("adminGenre").value.trim();

      const poster =
        document.getElementById("adminPoster").value.trim();

      const type =
        document.getElementById("adminType").value;

      const video =
        document.getElementById("adminVideo").value.trim();

      const description =
        document.getElementById("adminDescription").value.trim();


      if (!title) {

        alert("Digite o nome do filme ou série.");

        return;

      }


      if (!poster) {

        alert("Informe a URL da capa.");

        return;

      }


      if (type === "movie" && !video) {

        alert("Informe a URL do vídeo.");

        return;

      }


      const newMovie = {

        id:
          "movie-" +
          Date.now(),

        title,

        year:
          year ? Number(year) : "",

        genre,

        type,

        poster,

        video,

        description

      };


      catalog.push(newMovie);

      saveCatalog();


      alert(
        "Título adicionado ao catálogo!"
      );


      changePage("home");

    }


    /* =========================================================
       ROLAGEM
    ========================================================= */

    function scrollToCatalog() {

      const section =
        document.getElementById("catalogSection");

      if (section) {

        section.scrollIntoView({
          behavior: "smooth"
        });

      }

    }


    /* =========================================================
       ESCAPAR HTML
    ========================================================= */

    function escapeHtml(text) {

      const div =
        document.createElement("div");

      div.textContent = text;

      return div.innerHTML;

    }


    /* =========================================================
       TECLA ESC
    ========================================================= */

    document.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Escape") {

          closeMovie();

          closePlayer();

        }

      }
    );


    /* =========================================================
       CLIQUE FORA DO MODAL
    ========================================================= */

    document
      .getElementById("movieModal")
      .addEventListener(
        "click",
        function(event) {

          if (
            event.target === this
          ) {

            closeMovie();

          }

        }
      );


    /* =========================================================
       INICIAR SITE
    ========================================================= */

    renderCatalog();

  </script>

</body>
</html>
