<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Minha Estante</title>

  <style>
    * {
      box-sizing: border-box;

       TOPO

        linear-gradient(0deg, #090a0d 0%, transparent 50%),

       PLAYER

       VAZIO

      text-align: center;

    .empty-icon {

    /* =========================
       RESPONSIVO
    ========================= */

    @media (max-width: 700px) {

      header {
        height: auto;
        padding: 15px 5%;
        flex-direction: column;

  </style>
</head>

<body>

  <!-- =========================
       CABEÇALHO
  ========================== -->

  <header>

    <div class="logo">
      MINHA <span>ESTANTE</span>
    </div>

    <div class="header-right">

      <input
        id="searchInput"
        class="search"
        type="text"
        placeholder="Pesquisar filmes..."
      >

      <button
        class="add-button"
        onclick="openAddModal()"
      >
        + Adicionar
      </button>

    </div>

  </header>


  <!-- =========================
       HERO
  ========================== -->

  <section class="hero">

    <div class="hero-content">

      <small>Minha biblioteca</small>

      <h1>Seu cinema,<br>do seu jeito.</h1>

      <p>
        Guarde seus filmes em um só lugar, organize sua biblioteca
        e assista aos seus vídeos diretamente pelo site.
      </p>

    </div>

  </section>


  <!-- =========================
       CATÁLOGO
  ========================== -->

  <main>

    <div class="section-title">

      <h2>Minha biblioteca</h2>

      <span
        id="count"
        class="count"
      >
        0 filmes
      </span>

    </div>

    <div
      id="catalog"
      class="catalog"
    ></div>

  </main>


  <!-- =========================
       MODAL ADICIONAR
  ========================== -->

  <div
    id="addOverlay"
    class="overlay"
  >

    <div class="modal">

      <div class="modal-header">

        <h2>Adicionar filme</h2>

        <button
          class="close"
          onclick="closeAddModal()"
        >
          ×
        </button>

      </div>


      <form id="movieForm">

        <div class="form-group">

          <label for="movieTitle">
            Nome do filme
          </label>

          <input
            id="movieTitle"
            type="text"
            placeholder="Ex.: Harry Potter e a Pedra Filosofal"
            required
          >

        </div>


        <div class="form-group">

          <label for="movieYear">
            Ano
          </label>

          <input
            id="movieYear"
            type="number"
            placeholder="Ex.: 2001"
            min="1800"
            max="2100"
          >

        </div>


        <div class="form-group">

          <label for="moviePoster">
            Link da capa
          </label>

          <input
            id="moviePoster"
            type="url"
            placeholder="https://..."
          >

        </div>


        <div class="form-group">

          <label for="movieVideo">
            Link do vídeo
          </label>

          <input
            id="movieVideo"
            type="url"
            placeholder="Cole aqui o link direto do vídeo"
            required
          >

        </div>


        <div class="form-group">

          <label for="movieDescription">
            Descrição
          </label>

          <textarea
            id="movieDescription"
            placeholder="Escreva uma descrição do filme..."
          ></textarea>

        </div>


        <button
          type="submit"
          class="save-button"
        >
          ADICIONAR À BIBLIOTECA
        </button>

      </form>

    </div>

  </div>


  <!-- =========================
       MODAL DETALHES
  ========================== -->

  <div
    id="detailsOverlay"
    class="overlay"
  >

    <div class="modal">

      <div class="modal-header">

        <h2>Detalhes</h2>

        <button
          class="close"
          onclick="closeDetails()"
        >
          ×
        </button>

      </div>


      <div class="details">

        <img
          id="detailsPoster"
          class="details-poster"
          src=""
          alt=""
        >

        <div class="details-info">

          <h2 id="detailsTitle"></h2>

          <div
            id="detailsYear"
            class="details-year"
          ></div>

          <div
            id="detailsDescription"
            class="details-description"
          ></div>

        </div>

      </div>


      <button
        id="detailsPlay"
        class="play-large"
      >
        ▶ ASSISTIR
      </button>

    </div>

  </div>


  <!-- =========================
       PLAYER
  ========================== -->

  <div
    id="playerOverlay"
    class="overlay"
  >

    <div class="player-modal">

      <div class="player-top">

        <span
          id="playerTitle"
          class="player-title"
        >
          Filme
        </span>

        <button
          class="close"
          onclick="closePlayer()"
        >
          ×
        </button>

      </div>

      <video
        id="videoPlayer"
        controls
        playsinline
      ></video>

    </div>

  </div>


  <script>

    /* ==========================================
       BANCO DE FILMES
    ========================================== */

    const STORAGE_KEY = "minha_estante_filmes";

    let filmes = JSON.parse(
      localStorage.getItem(STORAGE_KEY) || "[]"
    );


    /* ==========================================
       ELEMENTOS
    ========================================== */

    const catalog = document.getElementById("catalog");
    const count = document.getElementById("count");
    const searchInput = document.getElementById("searchInput");


    /* ==========================================
       SALVAR
    ========================================== */

    function salvarFilmes() {

      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(filmes)
      );

    }


    /* ==========================================
       RENDERIZAR CATÁLOGO
    ========================================== */

    function renderCatalog() {

      const busca = searchInput.value
        .toLowerCase()
        .trim();


      const resultados = filmes.filter(filme => {

        return filme.title
          .toLowerCase()
          .includes(busca);

      });


      count.textContent =
        resultados.length +
        (resultados.length === 1 ? " filme" : " filmes");


      catalog.innerHTML = "";


      if (resultados.length === 0) {

        catalog.innerHTML = `

          <div class="empty">

            <div class="empty-icon">
              🎬
            </div>

            <h3>
              Sua biblioteca está vazia
            </h3>

            <p>
              Clique em "+ Adicionar" para colocar seu primeiro filme.
            </p>

          </div>

        `;

        return;

      }


      resultados.forEach(filme => {

        const originalIndex = filmes.indexOf(filme);

        const card = document.createElement("div");

        card.className = "card";


        let posterHTML = "";

        if (filme.poster) {

          posterHTML = `
            <img
              class="poster"
              src="${escapeHTML(filme.poster)}"
              alt="${escapeHTML(filme.title)}"
              onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
            >

            <div
              class="poster-placeholder"
              style="display:none;"
            >
              🎬
            </div>
          `;

        } else {

          posterHTML = `
            <div class="poster-placeholder">
              🎬
            </div>
          `;

        }


        card.innerHTML = `

          ${posterHTML}

          <button
            class="delete-button"
            title="Excluir"
            onclick="event.stopPropagation(); deleteMovie(${originalIndex})"
          >
            ×
          </button>

          <div class="card-info">

            <h3>
              ${escapeHTML(filme.title)}
            </h3>

            ${
              filme.year
                ? `<div class="year">${escapeHTML(filme.year)}</div>`
                : ""
            }

            <div class="card-actions">

              <button
                class="watch-button"
                onclick="event.stopPropagation(); playMovie(${originalIndex})"
              >
                ▶ Assistir
              </button>

              <button
                class="more-button"
                onclick="event.stopPropagation(); openDetails(${originalIndex})"
                title="Detalhes"
              >
                ⋯
              </button>

            </div>

          </div>

        `;


        card.addEventListener("click", () => {

          openDetails(originalIndex);

        });


        catalog.appendChild(card);

      });

    }


    /* ==========================================
       ADICIONAR FILME
    ========================================== */

    function openAddModal() {

      document
        .getElementById("addOverlay")
        .classList.add("active");

      document
        .getElementById("movieTitle")
        .focus();

    }


    function closeAddModal() {

      document
        .getElementById("addOverlay")
        .classList.remove("active");

    }


    document
      .getElementById("movieForm")
      .addEventListener("submit", function(event) {

        event.preventDefault();


        const title =
          document.getElementById("movieTitle").value.trim();

        const year =
          document.getElementById("movieYear").value.trim();

        const poster =
          document.getElementById("moviePoster").value.trim();

        const video =
          document.getElementById("movieVideo").value.trim();

        const description =
          document.getElementById("movieDescription").value.trim();


        if (!title || !video) {

          alert("Preencha pelo menos o nome e o link do vídeo.");

          return;

        }


        filmes.push({

          id: Date.now(),

          title: title,

          year: year,

          poster: poster,

          video: video,

          description: description

        });


        salvarFilmes();

        renderCatalog();

        this.reset();

        closeAddModal();

      });


    /* ==========================================
       DETALHES
    ========================================== */

    function openDetails(index) {

      const filme = filmes[index];

      if (!filme) return;


      const poster =
        document.getElementById("detailsPoster");


      if (filme.poster) {

        poster.src = filme.poster;
        poster.style.display = "block";

      } else {

        poster.style.display = "none";

      }


      document.getElementById("detailsTitle").textContent =
        filme.title;


      document.getElementById("detailsYear").textContent =
        filme.year || "";


      document.getElementById("detailsDescription").textContent =
        filme.description || "Nenhuma descrição adicionada.";


      document.getElementById("detailsPlay").onclick =
        () => playMovie(index);


      document
        .getElementById("detailsOverlay")
        .classList.add("active");

    }


    function closeDetails() {

      document
        .getElementById("detailsOverlay")
        .classList.remove("active");

    }


    /* ==========================================
       REPRODUZIR
    ========================================== */

    function playMovie(index) {

      const filme = filmes[index];

      if (!filme || !filme.video) {

        alert("Este filme não possui um link de vídeo.");

        return;

      }


      closeDetails();


      const player =
        document.getElementById("videoPlayer");


      document.getElementById("playerTitle").textContent =
        filme.title;


      player.src = filme.video;


      document
        .getElementById("playerOverlay")
        .classList.add("active");


      player.play().catch(() => {});

    }


    function closePlayer() {

      const player =
        document.getElementById("videoPlayer");


      player.pause();

      player.removeAttribute("src");

      player.load();


      document
        .getElementById("playerOverlay")
        .classList.remove("active");

    }


    /* ==========================================
       EXCLUIR
    ========================================== */

    function deleteMovie(index) {

      const filme = filmes[index];

      if (!filme) return;


      const confirmar =
        confirm(
          `Deseja excluir "${filme.title}" da sua biblioteca?`
        );


      if (!confirmar) return;


      filmes.splice(index, 1);

      salvarFilmes();

      renderCatalog();

    }


    /* ==========================================
       PESQUISA
    ========================================== */

    searchInput.addEventListener(
      "input",
      renderCatalog
    );


    /* ==========================================
       FECHAR MODAIS CLICANDO FORA
    ========================================== */

    document
      .getElementById("addOverlay")
      .addEventListener("click", function(event) {

        if (event.target === this) {

          closeAddModal();

        }

      });


    document
      .getElementById("detailsOverlay")
      .addEventListener("click", function(event) {

        if (event.target === this) {

          closeDetails();

        }

      });


    document
      .getElementById("playerOverlay")
      .addEventListener("click", function(event) {

        if (event.target === this) {

          closePlayer();

        }

      });


    /* ==========================================
       ESC FECHA JANELAS
    ========================================== */

    document.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Escape") {

          closeAddModal();

          closeDetails();

          closePlayer();

        }

      }
    );


    /* ==========================================
       SEGURANÇA BÁSICA PARA TEXTO DIGITADO
    ========================================== */

    function escapeHTML(text) {

      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /* ==========================================
       INICIAR
    ========================================== */

    renderCatalog();

  </script>

</body>
</html>
