<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Minha Estante</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #090909;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
    }

    /* =========================
       CABEÇALHO
    ========================= */

    header {
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6%;
      border-bottom: 1px solid #1c1c1c;
      background: #090909;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: 2px;
    }

    .logo span {
      color: #c7a15a;
    }

    .search {
      width: 240px;
      padding: 10px 14px;
      border-radius: 7px;
      border: 1px solid #2a2a2a;
      background: #151515;
      color: white;
      outline: none;
    }

    .search:focus {
      border-color: #c7a15a;
    }

    /* =========================
       CONTEÚDO
    ========================= */

    main {
      width: 88%;
      max-width: 1400px;
      margin: 0 auto;
      padding: 40px 0 70px;
    }

    .title {
      margin-bottom: 28px;
    }

    .title h1 {
      font-family: Georgia, serif;
      font-size: 30px;
      font-weight: 400;
    }

    /* =========================
       GRID
    ========================= */

    .movies {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 25px;
    }

    /* =========================
       CARD
    ========================= */

    .movie {
      background: #121212;
      border-radius: 9px;
      overflow: hidden;
      border: 1px solid #202020;
      transition: transform .25s, border-color .25s;
    }

    .movie:hover {
      transform: translateY(-5px);
      border-color: #3b3325;
    }

    .poster-container {
      position: relative;
      aspect-ratio: 2 / 3;
      overflow: hidden;
      background: #1a1a1a;
    }

    .poster {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform .3s;
    }

    .movie:hover .poster {
      transform: scale(1.03);
    }

    .movie-info {
      padding: 15px;
    }

    .movie-title {
      font-family: Georgia, serif;
      font-size: 17px;
      line-height: 1.4;
      min-height: 48px;
    }

    .watch {
      width: 100%;
      margin-top: 13px;
      padding: 11px;
      border: none;
      border-radius: 6px;
      background: #c7a15a;
      color: #111;
      font-weight: 700;
      cursor: pointer;
      transition: background .2s;
    }

    .watch:hover {
      background: #dfbc76;
    }

    /* =========================
       PLAYER
    ========================= */

    .player-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.92);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 30px;
      z-index: 100;
    }

    .player-overlay.active {
      display: flex;
    }

    .player-box {
      width: 100%;
      max-width: 1100px;
      background: #050505;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 20px 70px rgba(0,0,0,.7);
    }

    .player-header {
      height: 55px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      background: #111;
    }

    .player-title {
      font-size: 15px;
      font-weight: 600;
    }

    .close {
      width: 34px;
      height: 34px;
      border: none;
      border-radius: 50%;
      background: #252525;
      color: #fff;
      font-size: 20px;
      cursor: pointer;
    }

    .close:hover {
      background: #3a3a3a;
    }

    video {
      display: block;
      width: 100%;
      max-height: 78vh;
      background: #000;
    }

    /* =========================
       RESPONSIVO
    ========================= */

    @media (max-width: 1000px) {

      .movies {
        grid-template-columns: repeat(3, 1fr);
      }

    }

    @media (max-width: 700px) {

      header {
        height: auto;
        padding: 15px 5%;
        flex-direction: column;
        gap: 14px;
      }

      .search {
        width: 100%;
      }

      main {
        width: 92%;
        padding-top: 30px;
      }

      .movies {
        grid-template-columns: repeat(2, 1fr);
        gap: 14px;
      }

      .movie-info {
        padding: 11px;
      }

      .movie-title {
        font-size: 14px;
        min-height: 40px;
      }

      .watch {
        padding: 9px;
        font-size: 13px;
      }

      .player-overlay {
        padding: 10px;
      }

    }

    @media (max-width: 400px) {

      .movies {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      .title h1 {
        font-size: 25px;
      }

    }

  </style>
</head>

<body>

  <!-- CABEÇALHO -->

  <header>

    <div class="logo">
      MINHA <span>ESTANTE</span>
    </div>

    <input
      id="search"
      class="search"
      type="text"
      placeholder="Pesquisar..."
    >

  </header>


  <!-- FILMES -->

  <main>

    <div class="title">
      <h1>Filmes</h1>
    </div>

    <div id="movies" class="movies"></div>

  </main>


  <!-- PLAYER -->

  <div
    id="playerOverlay"
    class="player-overlay"
  >

    <div class="player-box">

      <div class="player-header">

        <div
          id="playerTitle"
          class="player-title"
        >
          Filme
        </div>

        <button
          class="close"
          onclick="closePlayer()"
        >
          ×
        </button>

      </div>

      <video
        id="video"
        controls
        playsinline
      ></video>

    </div>

  </div>


  <script>

    /*
      ==================================================
      FILMES
      ==================================================

      Cole os links diretos de vídeo nos campos "video".

      Exemplo:

      video: "https://seu-link-autorizado.mp4"

    */

    const filmes = [

      {
        title: "Harry Potter e a Pedra Filosofal",

        poster:
          "https://image.tmdb.org/t/p/w500/l1T6Y3mY9Z8N4M9Q0F1A0P8Q8rH.jpg",

        video:
          "https://cdnst96.tokyvideo.com/videos/872/872358/mp4/b9e7ad5476f2630b1948d594413b98b12d7bc7a1db3b2271fa5c38bd86c85a89.mp4?secure=j3LFEhcAp2tyaS9NMWK79Q%3D%3D%2C1790336091"
      },


      {
        title: "Harry Potter e a Câmara Secreta",

        poster:
          "https://image.tmdb.org/t/p/w500/7xXJ15VEf7G9Gd7mYJf1A9pQW8M.jpg",

        video:
          "https://cdnst96.tokyvideo.com/videos/872/872709/mp4/a3d757bafcdba94dc033cb58da35d35dd5253cab203d53d7cc5982f2c68021e6.mp4?secure=diU75_-MknFfRT77Gky6NA%3D%3D%2C1790338188"
      },


      {
        title: "Harry Potter e o Prisioneiro de Azkaban",

        poster:
          "https://image.tmdb.org/t/p/w500/aWxwnYoe8p2d2uE6Q3J7qJ1R8cL.jpg",

        video:
          "https://cdnst96.tokyvideo.com/videos/872/872882/mp4/a530578bcdef69a2cd03d6aaa57f820889635fa276f4659b08af93ad26a33363.mp4?secure=vf9P2zOLd_kP4mLjcN7zcw%3D%3D%2C1790338288"
      },


      {
        title: "Harry Potter e o Cálice de Fogo",

        poster:
          "https://image.tmdb.org/t/p/w500/fECBtHlr0RB2H5J4j3sY1kK8w5A.jpg",

        video:
          "https://cdnst96.tokyvideo.com/videos/873/873165/mp4/19497f6ae93165ef09c30c4238157abd1966a9b9f51420354ee4bfd627862e05.mp4?secure=M9D44-Tsy98pMXBMXm8UVw%3D%3D%2C1790338370"
      },


      {
        title: "Harry Potter e a Ordem da Fênix",

        poster:
          "https://image.tmdb.org/t/p/w500/5aOyriWkPec0zUDwY5Y4Q8Q1b2K.jpg",

        video:
          "https://cdnst96.tokyvideo.com/videos/874/874655/mp4/4849605068848543d1450db7500b5f6c65f99598cabbb89dccd913a61ccac497.mp4?secure=RroNEov0kUDkSXQYQEarCg%3D%3D%2C1790338451"
      },


      {
        title: "Harry Potter e o Enigma do Príncipe",

        poster:
          "https://image.tmdb.org/t/p/w500/z7uo8BjKXf5GQkJ8J1D4Y5K6Q9A.jpg",

        video:
          "https://cdnst30.tokyvideo.com/videos/874/874957/mp4/48042dc990a8c992c99d98ada0728810e5b7f0be1ecd06dc94521be97e22ff4c.mp4?secure=2m77D2Cg4S8a_MGJYv7EdQ%3D%3D%2C1790338633"
      },


      {
        title: "Harry Potter e as Relíquias da Morte - Parte 1",

        poster:
          "https://image.tmdb.org/t/p/w500/iGoXIpQb7Pot00EEdwpwPajheZ5.jpg",

        video:
          "https://cdnst30.tokyvideo.com/videos/874/874964/mp4/9592ebe8435f69b653ab5041cee1813c25ac408b20ba597c8adad11463268092.mp4?secure=uNDs4Ot3qT_wQri_TF506g%3D%3D%2C1790337836"
      },


      {
        title: "Harry Potter e as Relíquias da Morte - Parte 2",

        poster:
          "https://image.tmdb.org/t/p/w500/c54HpQmuwXjHq2C9wmoacY9bq6P.jpg",

        video:
          "https://cdnst64.tokyvideo.com/videos/887/887330/mp4/2f48ed51255c30a3a374c395533f517f03500b8cbc6218de3915aedb2dbe9163.mp4?secure=wuHtJykz66dp8AFPN0CX9Q%3D%3D%2C1790338736"
      }

    ];


    /* ==========================================
       MOSTRAR FILMES
    ========================================== */

    const moviesContainer =
      document.getElementById("movies");


    function renderMovies(lista) {

      moviesContainer.innerHTML = "";


      lista.forEach((filme) => {

        const card =
          document.createElement("div");

        card.className = "movie";


        card.innerHTML = `

          <div class="poster-container">

            <img
              class="poster"
              src="${filme.poster}"
              alt="${filme.title}"
              onerror="this.style.display='none';"
            >

          </div>

          <div class="movie-info">

            <div class="movie-title">
              ${filme.title}
            </div>

            <button
              class="watch"
              onclick="playMovie(${filmes.indexOf(filme)})"
            >
              ▶ Assistir
            </button>

          </div>

        `;


        moviesContainer.appendChild(card);

      });

    }


    /* ==========================================
       ABRIR PLAYER
    ========================================== */

    function playMovie(index) {

      const filme = filmes[index];

      if (!filme) return;


      if (
        !filme.video ||
        filme.video === "COLE_AQUI_O_LINK_DIRETO_AUTORIZADO"
      ) {

        alert(
          "Adicione um link de vídeo autorizado para este filme."
        );

        return;

      }


      const video =
        document.getElementById("video");


      document.getElementById("playerTitle")
        .textContent = filme.title;


      video.src = filme.video;


      document
        .getElementById("playerOverlay")
        .classList.add("active");


      video.play().catch(() => {});

    }


    /* ==========================================
       FECHAR PLAYER
    ========================================== */

    function closePlayer() {

      const video =
        document.getElementById("video");


      video.pause();

      video.removeAttribute("src");

      video.load();


      document
        .getElementById("playerOverlay")
        .classList.remove("active");

    }


    /* ==========================================
       PESQUISA
    ========================================== */

    document
      .getElementById("search")
      .addEventListener("input", function() {

        const termo =
          this.value.toLowerCase().trim();


        const filtrados =
          filmes.filter(filme =>
            filme.title
              .toLowerCase()
              .includes(termo)
          );


        renderMovies(filtrados);

      });


    /* ==========================================
       ESC FECHA O PLAYER
    ========================================== */

    document.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Escape") {

          closePlayer();

        }

      }
    );


    /* ==========================================
       INICIAR
    ========================================== */

    renderMovies(filmes);

  </script>

</body>
